syntax = "proto3";

package search.v1;

message UserSearchHitProto {
  string userId = 1;
  optional string documentId = 2;
  optional string email = 3;
  optional string username = 4;
  optional string displayName = 5;
  optional string avatar = 6;
  optional string bio = 7;
  optional bool isVerified = 8;
  optional int32 followersCount = 9;
  optional int32 followingCount = 10;
  optional string createdAt = 11;
  optional string updatedAt = 12;
}
