name: OmniServices CI Pipeline

on:
   push:
      branches:
         - main
         - staging
   pull_request:
      branches:
         - main
         - staging

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

jobs:
   lint-and-typecheck:
      name: Code Quality & Type Check
      runs-on: ubuntu-latest
      steps:
         - name: Checkout Code
           uses: actions/checkout@v4

         - name: Setup pnpm
           uses: pnpm/action-setup@v3
           with:
              version: 9

         - name: Setup Node.js
           uses: actions/setup-node@v4
           with:
              node-version: 20
              cache: 'pnpm'

         - name: Install Dependencies
           run: pnpm install --frozen-lockfile

         - name: Run Prisma Generate
           run: pnpm run prisma:generate

         - name: Check Code Formatting
           run: pnpm exec prettier --check "apps/**/*.ts" "libs/**/*.ts"

         - name: Run ESLint
           run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

         - name: Run TypeScript Type Check
           run: pnpm run typecheck

   unit-tests:
      name: Run Unit Tests
      runs-on: ubuntu-latest
      steps:
         - name: Checkout Code
           uses: actions/checkout@v4

         - name: Setup pnpm
           uses: pnpm/action-setup@v3
           with:
              version: 9

         - name: Setup Node.js
           uses: actions/setup-node@v4
           with:
              node-version: 20
              cache: 'pnpm'

         - name: Install Dependencies
           run: pnpm install --frozen-lockfile

         - name: Run Prisma Generate
           run: pnpm run prisma:generate

         - name: Execute Tests
           run: pnpm exec jest --passWithNoTests --runInBand

   build-all:
      name: Build All Microservices
      runs-on: ubuntu-latest
      needs: [lint-and-typecheck, unit-tests]
      steps:
         - name: Checkout Code
           uses: actions/checkout@v4

         - name: Setup pnpm
           uses: pnpm/action-setup@v3
           with:
              version: 9

         - name: Setup Node.js
           uses: actions/setup-node@v4
           with:
              node-version: 20
              cache: 'pnpm'

         - name: Install Dependencies
           run: pnpm install --frozen-lockfile

         - name: Run Prisma Generate
           run: pnpm run prisma:generate

         - name: Build All Services
           run: pnpm run build
