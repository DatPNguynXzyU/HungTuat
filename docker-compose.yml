name: omni-services

include:
   - apps/auth/docker-compose.yml
   - apps/notification/docker-compose.yml
   - apps/user/docker-compose.yml
   - apps/post/docker-compose.yml

services:
   redis:
      image: redis/redis-stack-server:latest
      container_name: omni-services-redis
      restart: unless-stopped
      ports:
         - '${REDIS_PORT:-6379}:6379'
      volumes:
         - redis_data:/data
      healthcheck:
         test: ['CMD', 'redis-cli', 'ping']
         interval: 10s
         timeout: 5s
         retries: 5
      networks:
         - omni-network

   rabbitmq:
      image: rabbitmq:3-management-alpine
      container_name: omni-services-rabbitmq
      restart: unless-stopped
      environment:
         RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
         RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      ports:
         - '${RABBITMQ_PORT:-5672}:5672'
         - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
      volumes:
         - rabbitmq_data:/var/lib/rabbitmq
      healthcheck:
         test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
         interval: 10s
         timeout: 5s
         retries: 5
      networks:
         - omni-network

   elasticsearch:
      image: elasticsearch:8.17.0
      container_name: omni-services-elasticsearch
      restart: unless-stopped
      environment:
         - discovery.type=single-node
         - xpack.security.enabled=false
         - xpack.security.http.ssl.enabled=false
         - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
      ulimits:
         memlock:
            soft: -1
            hard: -1
         nofile:
            soft: 65536
            hard: 65536
      ports:
         - '${ELASTICSEARCH_PORT:-9200}:9200'
      volumes:
         - elasticsearch_data:/usr/share/elasticsearch/data
      healthcheck:
         test: ['CMD-SHELL', 'curl -s http://localhost:9200/_cluster/health | grep -vq "\"status\":\"red\""']
         interval: 10s
         timeout: 10s
         retries: 10
      networks:
         - omni-network

   kibana:
      image: kibana:8.17.0
      container_name: omni-services-kibana
      restart: unless-stopped
      environment:
         - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      ports:
         - '${KIBANA_PORT:-5601}:5601'
      depends_on:
         elasticsearch:
            condition: service_healthy
      networks:
         - omni-network

volumes:
   redis_data:
      driver: local
   rabbitmq_data:
      driver: local
   elasticsearch_data:
      driver: local

networks:
   omni-network:
      driver: bridge
